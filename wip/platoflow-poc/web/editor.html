<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PlatoFlow PoC — editor harness</title>
  <style>
    /* Branding vars — twin of index.html / src/theme.ts (approximate targets). */
    :root {
      --pf-bg: #F7F6F3; --pf-canvas: #EFEDE8; --pf-surface: #FFFFFF;
      --pf-border: #E5E3DE; --pf-border-strong: #D6D3CC;
      --pf-text: #1A1A18; --pf-dim: #8A8880; --pf-faint: #A6A49C;
      --pf-input: #F1EFEA; --pf-hover: #ECEAE4; --pf-active: #E8E6E1;
      --pf-green: #3BA55D; --pf-danger: #C0392B; --pf-viewport: #0D0D0D;
      --pf-font: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    html, body { margin: 0; height: 100%; background: var(--pf-bg); color: var(--pf-text); font: 13px var(--pf-font); }
    #graph { position: relative; height: 100vh; }
    #graph canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="graph"><canvas id="graph-canvas"></canvas></div>
  <!-- T2: docked focus-editor card mounts here (focus.ts falls back to body) -->
  <div id="pf-focus-host"></div>
  <!-- Track A owns this entry: editor + mock registry + mock evaluator -->
  <script type="module" src="/src/editor/harness.ts"></script>
</body>
</html>
